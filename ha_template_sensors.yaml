  # ── Station images (optional) ─────────────────────────────────────────────
  # Third parameter per station: a path relative to the HA config dir. HA maps
  # /config/www/* to /local/*, so "www/config/radio-N.png" is served at
  # http://<ha-host>:8123/local/config/radio-N.png. The device builds that URL
  # from the `ha_url` secret and downloads the PNG via online_image (resized to
  # the 40x40 slot). Upload the PNG to /config/www/config/ or adjust the paths;
  # until the files exist the download fails and the tinted placeholder stays.
  # ──────────────────────────────────────────────────────────────────────────
  - name: "Radio Station 1 Image"
    state: "www/config/radio-1.png"
  - name: "Radio Station 2 Image"
    state: "www/config/radio-2.png"
