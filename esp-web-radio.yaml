# ==============================================================================
# ESP Web Radio - ESP32-S3 (JC3248W535C) + PCM5102 I2S DAC
#
# The actual credentials live in a git-ignored file. This project uses the
# filename `secrets_radio.yaml`; pass it to esphome with `--secrets secrets_radio.yaml`
# (or configure your ESPHome dashboard accordingly).
# ==============================================================================

substitutions:
  ap_ssid: "ESP Radio Fallback"     # keep in sync with wifi.ap.ssid below
  ap_password: !secret ap_password  # fallback AP password - WIFI: QR + wifi.ap.password below
  ap_password_display: !secret ap_password   # shown on the AP setup page
  ap_url: "http://192.168.4.1"      # fallback AP URL - text on the AP setup page
  station_count: 4                  # station presets (1..N); raise when more are declared

esphome:
  name: esp-web-radio
  friendly_name: ESP Internet Radio
  comment: "ESP32-S3 WiFi internet radio (JC3248W535C display + PCM5102 DAC)"
  on_boot:
    # Diagnostics: boot summary. The reset reason is reported by the RTC/IDF and
    # SURVIVES software reboots (see plans/troubleshooting-restarts.md), so a
    # spontaneous restart followed by an auto-reboot leaves a clear marker here.
    - logger.log:
        level: INFO
        tag: diag
        format: "BOOT reset_reason=%s uptime=%d s heap_free=%.0f B psram_free=%.0f B"
        args:
          - 'id(reset_reason).has_state() ? id(reset_reason).state.c_str() : "unknown"'
          - 'id(uptime_sec).has_state() ? (int) id(uptime_sec).state : -1'
          - 'id(heap_free).has_state() ? id(heap_free).state : -1.0f'
          - 'id(psram_free).has_state() ? id(psram_free).state : -1.0f'
    - lvgl.page.show: page_now_playing
    - light.turn_on: backlight
    - lambda: 'id(boot_done) = true;'
    - script.execute: refresh_stations   # populate the Stations page for the current mode
    - script.execute: sync_volume_ui     # boot volume restore -> mirror + popup UI
    # Boot volume OVERRIDE (Info/Settings page): apply the CONFIGURED
    # `startup_volume` (persisted global, editable via the settings popup)
    # instead of the component-restored live volume. Deliberate deviation from
    # pure component-volume-restore - the user-configured boot level wins over
    # whatever live volume the component persisted last session. Guarded so it
    # only acts when the values differ; the resulting on_volume trigger then
    # re-syncs the Now Playing popup slider/percent automatically.
    - if:
        condition:
          lambda: 'return fabsf(id(startup_volume) - id(volume_level)) > 0.001f;'
        then:
          - media_player.volume_set:
              id: esp_media_player
              volume: !lambda 'return id(startup_volume);'
    # Visualizer toggle: sync the Settings switch widget with the restored
    # `visualizer_enabled` global. If this fires on_value it only re-writes the
    # same value (player_playing is false at boot, so no show/hide side effect).
    - lvgl.widget.update:
        id: settings_sw_visualizer
        state: 
          checked: !lambda 'return id(visualizer_enabled);'
    # Seed the Info/Settings rows (startup volume, uptime, WiFi signal).
    - script.execute: refresh_settings_info
    # Bottom nav indicator starts focused on the home page.
    - lambda: 'id(current_page) = 0;'
    - script.execute: update_nav_indicator

  platformio_options:
    upload_speed: 921600
    build_unflags: -Werror=all
    board_build.flash_mode: dio
    board_build.f_flash: 80000000L
    board_build.f_cpu: 240000000L
    

# ---------------------------------------------------------------------------
# MCU / framework
# ---------------------------------------------------------------------------
esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      # Required for good I2S audio timing
      CONFIG_ESP32S3_DEFAULT_CPU_FREQ_240: "y"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      # Allow code/data to run from PSRAM (needed by the audio pipeline)
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: y
      CONFIG_SPIRAM_RODATA: y
      # HTTPS radio streams (direct https URLs, http->https redirects and HA
      # radio_browser streams): let the media player's HTTP client connect
      # without server-certificate verification (public radio streams).
      CONFIG_ESP_TLS_SKIP_SERVER_CERT_VERIFY: "y"

# 8 MB octal PSRAM on this board. Audio pipeline + LVGL both want it.
psram:
  mode: octal
  speed: 80MHz

# ---------------------------------------------------------------------------
# Modular configuration via packages (see ./packages/*.yaml)
# ---------------------------------------------------------------------------
packages:
  hardware:       !include esp-web-radio/packages/esp-web-radio-hardware.yaml
  audio:          !include esp-web-radio/packages/esp-web-radio-audio.yaml
  homeassistant:  !include esp-web-radio/packages/esp-web-radio-homeassistant.yaml
  offline_stations: !include esp-web-radio/packages/esp-web-radio-offline_stations.yaml
  lvgl_ui:        !include esp-web-radio/packages/esp-web-radio-lvgl_ui.yaml
  fonts:          !include esp-web-radio/packages/display-fonts.yaml
  colors:         !include esp-web-radio/packages/common-colors.yaml
  theme:          !include esp-web-radio/packages/lvgl_theme.yaml
  page_now_playing: !include esp-web-radio/packages/esp-web-radio-page_now_playing.yaml
  page_stations:  !include esp-web-radio/packages/esp-web-radio-page_stations.yaml
  page_ap_setup: !include esp-web-radio/packages/esp-web-radio-page_ap_setup.yaml
  page_settings:  !include esp-web-radio/packages/esp-web-radio-page_settings.yaml

# ---------------------------------------------------------------------------
# Custom components (plans/visualizer.md): spectrum_tap taps the PCM stream
# between the mixer and the I2S DAC for the 16-band FFT audio visualizer on
# the Now Playing page. Loaded explicitly via `external_components` (ESPHome
# would also auto-discover custom_components/, this makes the dependency
# deterministic and self-documenting). Source lives in custom_components/
# spectrum_tap/ - extracted verbatim from plans/spectrum_tap.zip.
# ---------------------------------------------------------------------------
external_components:
  - source:
      type: local
      path: esp-web-radio/custom_components
    components: [spectrum_tap, spectrum_viz]

# ---------------------------------------------------------------------------
# Connectivity
# ---------------------------------------------------------------------------
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  # Fallback access point (captive portal) when WiFi is unavailable
  ap:
    ssid: "${ap_ssid}"
    password: "${ap_password}"
    ap_timeout: 20s

captive_portal:

# ---------------------------------------------------------------------------
# Logging / diagnostics (see plans/troubleshooting-restarts.md)
#
# Level: keep `DEBUG` as the steady state (default; cheap since ESPHome 2026.4
# moved routine state-change messages to VERBOSE). Switch to `VERBOSE` ONLY
# while reproducing a crash - it adds IDF heap/backtrace detail but slows the
# device, can destabilize audio/LVGL timing and must not be left on long-term.
#
# Transport: on the ESP32-S3 the logger default hardware UART is USB_SERIAL_JTAG
# (GPIO19/20 native USB) at 115200 baud - the path used for the captured serial
# logs in logs/*.txt. Do not change hardware_uart unless the capture setup
# changes (I2S/LVGL are unaffected by the log UART).
# ---------------------------------------------------------------------------
logger:
  level: DEBUG
  baud_rate: 115200

# Home Assistant native API
api:
  encryption:
    key: !secret api_encryption_key

ota:
  - platform: esphome

# ---------------------------------------------------------------------------
# Diagnostics (plans/troubleshooting-restarts.md)
#
# The `debug` component (https://esphome.io/components/debug/) publishes the
# last reset reason and memory health. On ESP-IDF the heap sensors report the
# internal DRAM heap; `psram` reports free PSRAM (the audio pipeline + LVGL run
# mostly from there). Values also become HA entities (default, internal:false),
# so HA history shows the memory trend across restarts.
#
# NOTE on the schema: this follows the CURRENT official docs (nested keys,
# e.g. `free:` / `reset_reason:`). If the installed ESPHome release predates
# that schema it must be switched back to the legacy `type:` form
# (see plans/troubleshooting-restarts.md, "Not verified locally").
# ---------------------------------------------------------------------------
debug:
  update_interval: 60s

sensor:
  - platform: debug
    free:
      id: heap_free
      name: "Heap Free"
    min_free:
      id: heap_min_free
      name: "Heap Min Free"
    block:
      id: heap_block
      name: "Heap Max Block"
    fragmentation:
      id: heap_fragmentation
      name: "Heap Fragmentation"
    psram:
      id: psram_free
      name: "Free PSRAM"
    loop_time:
      id: loop_time
      name: "Loop Time"

text_sensor:
  - platform: debug
    reset_reason:
      id: reset_reason
      name: "Reset Reason"
      on_value:
        - script.execute: refresh_settings_info   # Info page: (re)seed the reset-reason row

# ---------------------------------------------------------------------------
# Heartbeat diagnostics: one low-frequency INFO line every 15 minutes with
# uptime + heap/PSRAM state. In a captured serial log this shows the memory
# trend BEFORE a spontaneous restart (heap exhaustion, fragmentation growth)
# while staying quiet enough for long-term operation.
# ---------------------------------------------------------------------------
interval:
  - id: heartbeat_diag
    interval: 15min
    then:
      - logger.log:
          level: INFO
          tag: diag
          format: "HEARTBEAT uptime=%d s heap_free=%.0f B heap_min_free=%.0f B frag=%.1f pct psram_free=%.0f B loop_time=%.0f"
          args:
            - 'id(uptime_sec).has_state() ? (int) id(uptime_sec).state : -1'
            - 'id(heap_free).has_state() ? id(heap_free).state : -1.0f'
            - 'id(heap_min_free).has_state() ? id(heap_min_free).state : -1.0f'
            - 'id(heap_fragmentation).has_state() ? id(heap_fragmentation).state : -1.0f'
            - 'id(psram_free).has_state() ? id(psram_free).state : -1.0f'
            - 'id(loop_time).has_state() ? id(loop_time).state : -1.0f'

globals:
  - id: boot_done
    type: bool
    initial_value: "false"
  - id: boot_spinner_angle
    type: int
    restore_value: no
    initial_value: "0"    