# ==============================================================================
# audio.yaml - I2S DAC + speaker + media player
#
# DAC: PCM5102-style I2S stereo decoder with a BUILT-IN PLL, so may NOT
#      need an external MCLK. It also has a dedicated MUTE pin that requires a
#      LOGIC LOW level to mute (default = unmuted).
#
# Wiring:
#   BCLK  = GPIO6
#   LRCLK = GPIO5
#   DOUT  = GPIO15
#   MCLK  = GPIO16
#   MUTE  = GPIO7   (LOW mutes the DAC)
#
# Line-level analog output goes to your external amplifier.
# ==============================================================================

# ──────────────────────────────────────
# I2S Audio → PCM5102A
# ──────────────────────────────────────
i2s_audio:
  i2s_lrclk_pin: GPIO5
  i2s_bclk_pin: GPIO6
  i2s_mclk_pin: GPIO16

speaker:
  # Base I2S output to the PCM5102A
  - platform: i2s_audio
    id: i2s_speaker
    dac_type: external
    i2s_dout_pin: GPIO15
    channel: stereo
    sample_rate: 48000
    bits_per_sample: 16bit

  # Spectrum tap (custom speaker passthrough, plans/visualizer.md): sits
  # between the mixer and the I2S output, transparently forwards every PCM
  # frame to i2s_speaker and feeds a 128-point FFT (16 bands -> spec_bands[])
  # for the Now Playing visualizer (custom_components/spectrum_tap). Audio is
  # untouched: the mixer just sees it as its output speaker. FFT work happens
  # only while play() flows (i.e. while playing), so idle/paused costs nothing.
  - platform: spectrum_tap
    id: spectrum_tap_speaker
    output_speaker: i2s_speaker
    # Transparent passthrough, but the mixer/media_player chain validates the
    # output speaker's stream properties (and inherits them into the mixer) -
    # mirror i2s_speaker above: 16 bit, stereo, 48 kHz.
    bits_per_sample: 16
    num_channels: 2
    sample_rate: 48000

  # Mixer: merges the media + announcement pipelines into one output
  - platform: mixer
    id: main_mixer_speaker
    output_speaker: spectrum_tap_speaker
    source_speakers:
      - id: announcement_mixer_input
      - id: media_mixer_input

  # Resampler for the media pipeline
  - platform: resampler
    id: main_media_resampler
    output_speaker: media_mixer_input
    sample_rate: 48000

  # Resampler for the announcement pipeline
  - platform: resampler
    id: main_announcement_resampler
    output_speaker: announcement_mixer_input
    sample_rate: 48000

# ──────────────────────────────────────
# MUTE: GPIO7 → PCM5102A XSMT pin (active LOW)
# ──────────────────────────────────────
switch:
  - platform: gpio
    pin: GPIO7
    id: dac_mute
    name: "DAC Mute"
    restore_mode: ALWAYS_OFF
    inverted: true   # ON → LOW → muted | OFF → HIGH → unmuted

# ──────────────────────────────────────
# HTTP media source: required for native (no-HA) playback of stream URLs.
# Without this component the speaker media player cannot open http(s) URLs and
# fails instantly with ESP_ERR_NOT_SUPPORTED (verified in logs/play_issue_2118.txt).
# ──────────────────────────────────────
media_source:
  - platform: audio_http
    id: http_source

# ──────────────────────────────────────
# Media Player (speaker platform)
# ──────────────────────────────────────
media_player:
  - platform: speaker
    name: "ESP Media Player"
    id: esp_media_player
    # Compile ALL decoders (FLAC/MP3/OPUS/WAV). With `format: FLAC` alone only
    # the FLAC decoder is built, so direct MP3 URLs (wifi-only mode) fail with
    # ESP_ERR_NOT_SUPPORTED; HA mode still works because HA transcodes to FLAC.
    media_pipeline:
      speaker: main_media_resampler
      format: NONE          # compile all decoders (MP3, FLAC, OPUS, WAV)
      num_channels: 2
      # sample_rate intentionally omitted: for native URLs the pipeline derives
      # it from the stream itself; HA transcoding falls back to the speaker's
      # sample rate (48000) exactly as before.
    announcement_pipeline:
      speaker: main_announcement_resampler
      format: FLAC
      num_channels: 1
      sample_rate: 48000

    # Native step size for `media_player.volume_up` / `media_player.volume_down`
    # (matches the documented 5% default; explicit makes it self-documenting).
    # Build-time check item: if the installed ESPHome speaker platform does not
    # accept `volume_increment`, drop this line and rely on the default.
    volume_increment: 0.05

    # Imp 4/6: native play-state hooks — drive mp_visualizer visibility and the
    # play/pause glyph on mp_lbl_play_icon in EVERY mode (incl. no-HA), and keep
    # the `player_playing` global current for mp_btn_play. The HA `player_state`
    # sensor updates the same glyph when connected — both reflect the same
    # truth, so there is no conflict.
    # Note: payload-free triggers on_play/on_pause/on_idle are used instead of
    # on_state because on_state forwards a MediaPlayerState enum (not a string).
    on_play:
      - logger.log: "media player playing"
      - lambda: 'id(player_playing) = true;'
      # Visualizer toggle (Info/Settings page): `visualizer_enabled` (persisted
      # global, settings page) gates the strip - show it only while enabled.
      # Re-enabling while playing re-shows the strip via the toggle row's own
      # handler; pause/idle hiding below stays unconditional (unchanged). The
      # FFT/speaker tap keeps running regardless - only the LVGL strip is gated.
      - if:
          condition:
            lambda: 'return id(visualizer_enabled);'
          then:
            - lvgl.widget.show: mp_visualizer
      - lvgl.label.update:
          id: mp_lbl_play_icon
          text: ${text_pause}
    on_pause:
      - logger.log: "media player paused"
      - lambda: 'id(player_playing) = false;'
      - lvgl.widget.hide: mp_visualizer
      - lvgl.label.update:
          id: mp_lbl_play_icon
          text: ${text_play}
    on_idle:
      - logger.log: "media player idle"
      - lambda: 'id(player_playing) = false;'
      - lvgl.widget.hide: mp_visualizer
      # Imp 7/8: on stop HA clears media_position/media_duration (sensors go
      # unknown and never fire again), so the time labels + progress bar are
      # hidden here; the position/duration on_value handlers re-show them.
      - lvgl.widget.hide: mp_lbl_elapsed
      - lvgl.widget.hide: mp_lbl_total
      - lvgl.widget.hide: mp_bar_progress
      - lvgl.label.update:
          id: mp_lbl_play_icon
          text: ${text_play}

    # ──────────────────────────────────────────────────────────────────────────
    # Volume/mute hooks — EVENT-DRIVEN (plans/refactor-media-player-hooks.md).
    # The speaker component is the single source of truth for volume & mute:
    # local commands (volume_up/volume_down/volume_set/volume_mute) and
    # HA-originated changes arriving via the native API all surface here as
    # trigger events. These handlers are pure reactions (UI sync + DAC hardware
    # mute + guarded HA mute push); they contain no command logic.
    #
    # Loop protection (plan §"Loop protection strategy"): the volume path never
    # pushes to HA (device->HA publication covers it), so no echo loop is
    # possible. The mute path keeps ONE guarded push here, latched via
    # `volume_mute_last_pushed` immediately after each push; the guard exists in
    # exactly these two handlers and nowhere else.
    # ──────────────────────────────────────────────────────────────────────────
    on_mute:
      - lambda: 'id(volume_muted) = true;'
      - switch.turn_on: dac_mute          # XSMT active-low: ON -> LOW -> DAC muted
      - lambda: 'lv_obj_set_style_text_color(id(mp_lbl_mute_icon), lv_color_hex(${color_accent}), 0);'
      - if:
          condition:
            lambda: 'return id(ha_connected) && !id(volume_mute_last_pushed);'
          then:
            # D1: guarded HA push - device->HA `is_volume_muted` publication is
            # the one unproven direction; delete this push + the guard once
            # on-device test 4 proves the attribute auto-mirrors (plan D1-B).
            - homeassistant.action:
                action: media_player.volume_mute
                data:
                  entity_id: media_player.esp_media_player
                  is_volume_muted: "true"
            - lambda: 'id(volume_mute_last_pushed) = true;'
    on_unmute:
      - lambda: 'id(volume_muted) = false;'
      - switch.turn_off: dac_mute          # XSMT: OFF -> HIGH -> DAC unmuted
      - lambda: 'lv_obj_set_style_text_color(id(mp_lbl_mute_icon), lv_color_hex(${color_text_muted}), 0);'
      - if:
          condition:
            lambda: 'return id(ha_connected) && id(volume_mute_last_pushed);'
          then:
            - homeassistant.action:
                action: media_player.volume_mute
                data:
                  entity_id: media_player.esp_media_player
                  is_volume_muted: "false"
            - lambda: 'id(volume_mute_last_pushed) = false;'
    on_volume:
      # Fires for EVERY volume change regardless of source. `x` = new volume as
      # float 0..1. Single universal sync point for the popup slider + percent
      # label. Deliberately does NOT call show_volume_popup - the popup is a
      # response to a local touch, not to state changes (plan D5).
      - lambda: 'id(volume_level) = x;'
      - lvgl.slider.update:
          id: volume_slider
          value: !lambda 'return (int)(x * 100.0f);'
      - lvgl.label.update:
          id: mp_lbl_volume
          text: !lambda |-
            int v = (int)(x * 100.0f);
            char buf[8];
            snprintf(buf, sizeof(buf), "%d%%", v);
            return buf;
