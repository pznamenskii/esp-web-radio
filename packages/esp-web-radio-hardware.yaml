# ==============================================================================
# hardware.yaml - MCU peripherals for the JC3248W535C board
#
# Display: AXS15231B combo driver, QSPI interface + I2C capacitive touch.
# Configured for LANDSCAPE (480 wide x 320 tall) so all LVGL layouts below are
# authored in landscape coordinates.
# ==============================================================================

# QSPI bus used by the display. `type: quad` -> single clock + 4 data lines.
spi:
  - id: display_qspi
    type: quad
    clk_pin: 47
    data_pins: [21, 48, 40, 39]

# I2C bus used by the capacitive touch controller.
i2c:
  - id: touchscreen_bus
    sda: 4
    scl: 8
    frequency: 400kHz

# ---------------------------------------------------------------------------
# Display (AXS15231B QSPI, presented in landscape 480x320)
# ---------------------------------------------------------------------------
display:
  - platform: mipi_spi
    model: JC3248W535
    id: main_display
    data_rate: 40MHz
    spi_id: display_qspi
    dimensions:
      width: 320
      height: 480
    cs_pin: 45
#    rotation: 90    
    update_interval: never       # LVGL drives the redraw
    auto_clear_enabled: false    # required by LVGL

# ---------------------------------------------------------------------------
# Touchscreen (I2C, same AXS15231 chip)
# ---------------------------------------------------------------------------
touchscreen:
  - platform: axs15231
    id: main_touch
    display: main_display
    i2c_id: touchscreen_bus
    on_touch:
      - logger.log:
          format: "[TCH] touch at (%d, %d)"
          args: [touch.x, touch.y]
      - if:
          condition: lvgl.is_paused
          then:
            - light.turn_on: backlight    # instant light at touch-down
    on_release:       # safe input handoff: resume only after finger is up
      then:
        # [TCH] diagnosis (TODO "reacts on touch instead of release"): the
        # touchscreen core emits this trigger when a poll reports NO touch
        # points. If this fires while the finger is still held down, the
        # axs15231 driver is generating a false release (its `update_touches()`
        # treats any poll with data[0] != 0 as "no touches"), and LVGL then sees
        # a full press+release - i.e. CLICKED - at touch-down time. Kept
        # permanently per the user's request for permanent diagnostic logs.
        - logger.log: "[TCH] release"
        - if:
            condition: lvgl.is_paused
            then:
              - logger.log: "DBG: WAKE branch - resuming LVGL + backlight on"
              - lvgl.resume:
              - lvgl.widget.redraw:
              # Wake from global idle = "idle screen": return to Now Playing and
              # refocus the bottom nav indicator. Overlays (boot screen, OTA,
              # volume popup) are not touched here - each has its own lifecycle
              # (the volume popup auto-hides after 5 s via show_volume_popup).
              - lvgl.page.show: ${homepage}
              - lambda: 'id(current_page) = 0;'
              - script.execute: update_nav_indicator
#    transform:
#      swap_xy: true
#      mirror_y: true

# ---------------------------------------------------------------------------
# Power / status
# ---------------------------------------------------------------------------
# LCD backlight. For this panel the driver does NOT manage the backlight, so it
# is driven by a dedicated PWM (LEDC) output on GPIO1 (active high). Exposed as
# a dimmable monochromatic light so it turns on at boot and can be controlled
# from Home Assistant or the Settings page slider.
# ---------------------------------------------------------------------------
output:
  - platform: ledc
    id: backlight_output
    pin: GPIO1
    frequency: 5000Hz

light:
  - platform: monochromatic
    id: backlight
    name: "ESP Media Player Backlight"
    output: backlight_output
    restore_mode: ALWAYS_ON
    internal: false

# ---------------------------------------------------------------------------
# Power / status
# ---------------------------------------------------------------------------
binary_sensor:
  - platform: status
    name: "ESP Media Player Radio Status"
    id: radio_status