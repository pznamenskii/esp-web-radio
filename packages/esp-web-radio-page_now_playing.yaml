# ==============================================================================
# page_now_playing.yaml - Now Playing page (port of lvgl_designer_NowPlaying.yaml)
#
# Geometry follows the LVGL Designer export; fonts come from display-fonts.yaml,
# colors/styles from packages/lvgl_theme.yaml (no raw hex on this page). Widget
# -> sensor bindings and the hide/show rules live in
# packages/esp-web-radio-homeassistant.yaml / esp-web-radio-audio.yaml.
#
# STATIC LAYOUT CONTRACT (Fix 1): every widget on this page is ABSOLUTELY
# positioned inside `mp_card` with explicit x/y/width/height; hiding a widget
# never reflows siblings - hidden labels keep their fixed slot reserved.
# ==============================================================================

# ---------------------------------------------------------------------------
# Volume/mute controls are EVENT-DRIVEN (plans/refactor-media-player-hooks.md):
# every command on this page is a pure native `media_player` action; all UI /
# DAC / HA reactions run in the component's on_volume / on_mute / on_unmute
# triggers (esp-web-radio-audio.yaml). `volume_level` / `volume_muted` are
# read-only mirrors; `volume_mute_last_pushed` is the loop-protection guard for
# the one retained HA mute push (device->HA). Full model: README.
# ---------------------------------------------------------------------------
globals:
  # Read-only mirror of the component volume (0..1), updated by on_volume.
  # No command reads it anymore; consumers are DBG logs and the future
  # "startup volume" settings item (plan D3).
  - id: volume_level
    type: float
    restore_value: no
    initial_value: "0.5"
  # Read-only mirror of the component mute state, updated by on_mute/on_unmute.
  # Consumer: the mp_btn_mute toggle decision.
  - id: volume_muted
    type: bool
    restore_value: no
    initial_value: "false"
  # Loop-protection guard for the ONE retained HA push (device->HA
  # `is_volume_muted` in on_mute/on_unmute, esp-web-radio-audio.yaml): latched
  # right after each push so an HA echo can never re-trigger it. Self-healing:
  # the first mute/unmute after boot always pushes once (idempotent HA call).
  - id: volume_mute_last_pushed
    type: bool
    restore_value: no
    initial_value: "false"

script:
  # Volume popup overlay: show it, then auto-hide after 5 s of inactivity.
  # `mode: restart` means every re-trigger (each -/+ press or slider release)
  # cancels the pending run and starts a fresh 5 s countdown - no native
  # timer required. The popup is shown ONLY from local touch handlers; the
  # media_player triggers never pop it (HA-originated changes must not open a
  # popup, plan D5).
  - id: show_volume_popup
    mode: restart
    then:
      - lvgl.widget.show: volume_popup
      - delay: 5s
      - lvgl.widget.hide: volume_popup

  # Boot/restore (plan §Boot/restore, D6): read the volume the speaker
  # component restored from flash and push it into the mirror + popup so the
  # screen matches reality immediately. on_volume cannot be relied on at boot
  # (restoring a persisted value is not a change, so the trigger never fires).
  # Build-time check item: getter spelling `id(esp_media_player).volume` vs
  # `.get_volume()` per installed ESPHome; fallback is to skip the read and
  # accept the 50% display until the first volume event.
  # Boot mute state (plan §Boot/restore + Edge cases): the component restores
  # its volume but starts UNMUTED; `dac_mute` restore_mode ALWAYS_OFF keeps the
  # DAC unmuted and the `volume_muted=false` mirror / gray glyph (YAML
  # defaults) already agree - a reboot while muted comes back unmuted at the
  # persisted volume, nothing extra needed. (On-device checklist: verify the
  # booted screen shows the persisted volume + gray unmuted glyph.)
  - id: sync_volume_ui
    then:
      - lambda: 'id(volume_level) = id(esp_media_player).volume;'
      - lvgl.slider.update:
          id: volume_slider
          value: !lambda 'return (int)(id(volume_level) * 100.0f);'
      - lvgl.label.update:
          id: mp_lbl_volume
          text: !lambda |-
            int v = (int)(id(volume_level) * 100.0f);
            char buf[8];
            snprintf(buf, sizeof(buf), "%d%%", v);
            return buf;

