# ==============================================================================
# page_now_playing.yaml - Now Playing page (port of lvgl_designer_NowPlaying.yaml)
#
# Geometry follows the LVGL Designer export; fonts come from display-fonts.yaml,
# colors/styles from packages/lvgl_theme.yaml (no raw hex on this page). Widget
# -> sensor bindings and the hide/show rules live in
# packages/esp-web-radio-homeassistant.yaml / esp-web-radio-audio.yaml.
#
# STATIC LAYOUT CONTRACT (Fix 1): every widget on this page is ABSOLUTELY
# positioned inside `mp_card` with explicit x/y/width/height; hiding a widget
# never reflows siblings - hidden labels keep their fixed slot reserved.
# ==============================================================================

# ---------------------------------------------------------------------------
# Volume/mute controls are EVENT-DRIVEN (plans/refactor-media-player-hooks.md):
# every command on this page is a pure native `media_player` action; all UI /
# DAC / HA reactions run in the component's on_volume / on_mute / on_unmute
# triggers (esp-web-radio-audio.yaml). `volume_level` / `volume_muted` are
# read-only mirrors; `volume_mute_last_pushed` is the loop-protection guard for
# the one retained HA mute push (device->HA). Full model: README.
# ---------------------------------------------------------------------------
globals:
  # Read-only mirror of the component volume (0..1), updated by on_volume.
  # No command reads it anymore; consumers are DBG logs and the future
  # "startup volume" settings item (plan D3).
  - id: volume_level
    type: float
    restore_value: no
    initial_value: "0.5"
  # Read-only mirror of the component mute state, updated by on_mute/on_unmute.
  # Consumer: the mp_btn_mute toggle decision.
  - id: volume_muted
    type: bool
    restore_value: no
    initial_value: "false"
  # Loop-protection guard for the ONE retained HA push (device->HA
  # `is_volume_muted` in on_mute/on_unmute, esp-web-radio-audio.yaml): latched
  # right after each push so an HA echo can never re-trigger it. Self-healing:
  # the first mute/unmute after boot always pushes once (idempotent HA call).
  - id: volume_mute_last_pushed
    type: bool
    restore_value: no
    initial_value: "false"

script:
  # Volume popup overlay: show it, then auto-hide after 5 s of inactivity.
  # `mode: restart` means every re-trigger (each -/+ press or slider release)
  # cancels the pending run and starts a fresh 5 s countdown - no native
  # timer required. The popup is shown ONLY from local touch handlers; the
  # media_player triggers never pop it (HA-originated changes must not open a
  # popup, plan D5).
  - id: show_volume_popup
    mode: restart
    then:
      - lvgl.widget.show: volume_popup
      - delay: 5s
      - lvgl.widget.hide: volume_popup

  # Boot/restore (plan §Boot/restore, D6): read the volume the speaker
  # component restored from flash and push it into the mirror + popup so the
  # screen matches reality immediately. on_volume cannot be relied on at boot
  # (restoring a persisted value is not a change, so the trigger never fires).
  # Build-time check item: getter spelling `id(esp_media_player).volume` vs
  # `.get_volume()` per installed ESPHome; fallback is to skip the read and
  # accept the 50% display until the first volume event.
  # Boot mute state (plan §Boot/restore + Edge cases): the component restores
  # its volume but starts UNMUTED; `dac_mute` restore_mode ALWAYS_OFF keeps the
  # DAC unmuted and the `volume_muted=false` mirror / gray glyph (YAML
  # defaults) already agree - a reboot while muted comes back unmuted at the
  # persisted volume, nothing extra needed. (On-device checklist: verify the
  # booted screen shows the persisted volume + gray unmuted glyph.)
  - id: sync_volume_ui
    then:
      - lambda: 'id(volume_level) = id(esp_media_player).volume;'
      - lvgl.slider.update:
          id: volume_slider
          value: !lambda 'return (int)(id(volume_level) * 100.0f);'
      - lvgl.label.update:
          id: mp_lbl_volume
          text: !lambda |-
            int v = (int)(id(volume_level) * 100.0f);
            char buf[8];
            snprintf(buf, sizeof(buf), "%d%%", v);
            return buf;

lvgl:
  pages:
    - id: page_now_playing
      pad_all: 0
      scrollbar_mode: "OFF"
      # Swipe navigation: shared handlers from swipe_navigation.yaml.
      # Kept at PAGE level (not top_layer): LVGL delivers gesture events to the
      # object under the finger (page content) and bubbles them up to the page
      # screen — top_layer never receives them (see logs/log_2040.txt).
      <<: !include swipe_navigation.yaml
      widgets:
        - obj:
            id: mp_card
            styles: card
            x: 0
            y: 0
            width: 480
            height: 320
            pad_all: 0
            scrollbar_mode: "OFF"
            widgets:
              - obj:
                  id: mp_station_logo
                  styles: panel
                  x: 4
                  y: 29
                  width: 102
                  height: 102
                  pad_all: 0
                  scrollbar_mode: "OFF"
                  # Imp 4: hidden until a station-picture source exists (roadmap item 4)
                  hidden: true
              - obj:
                  id: mp_now_playing_art
                  styles: panel
                  x: 373
                  y: 29
                  width: 102
                  height: 102
                  pad_all: 0
                  scrollbar_mode: "OFF"
                  # Imp 4: shown only while art metadata exists (now_playing_art
                  # sensor in esp-web-radio-homeassistant.yaml); image rendering
                  # itself is a later roadmap item.
                  hidden: true
              - obj:
                  id: mp_visualizer
                  styles: panel
                  x: 4
                  y: 137
                  width: 472
                  height: 75
                  pad_all: 0
                  scrollbar_mode: "OFF"
                  # Imp 4: shown only while playing (driven by the media_player
                  # on_play/on_pause/on_idle triggers in esp-web-radio-audio.yaml)
                  hidden: true
              - label:
                  id: mp_station_title
                  styles: text_title
                  x: 16
                  y: 29
                  width: 344
                  height: 32
                  text: "Выбери радиостанцию"
                  long_mode: SCROLL
              # Hidden when the artist value is empty (now_playing_artist
              # sensor). Fixed x/y/width/height keep the slot reserved so
              # sibling widgets never move (static-layout contract, Fix 1).
              - label:
                  id: mp_now_playing_artist
                  styles: text_muted
                  x: 16
                  y: 65
                  width: 344
                  height: 26
                  text: ""
                  text_align: LEFT
                  long_mode: SCROLL
                  text_font: ${font_icon}
              # Hidden when the track value is empty (now_playing_track sensor).
              # Slot stays reserved with fixed dimensions (static layout, Fix 1).
              - label:
                  id: mp_lnow_playing_track
                  styles: text_muted
                  x: 16
                  y: 95
                  width: 344
                  height: 36
                  text: ""
                  text_align: LEFT
                  long_mode: SCROLL
                  text_font: ${font_small}
              - bar:
                  id: mp_bar_progress
                  # Imp 7/8: hidden until a track duration is known (shown by the
                  # player_position / player_duration on_value handlers).
                  hidden: true
                  x: 19
                  y: 220
                  width: 441
                  height: 12
                  value: 0
                  min_value: 0
                  max_value: 100
                  indicator:
                    bg_color: ${color_accent}
                    bg_opa: 80%
                    radius: 4
                  bg_color: ${color_panel}
                  radius: 4
                  bg_opa: 100%
              - label:
                  id: mp_lbl_elapsed
                  # Imp 7/8: hidden until a media position exists (0 while the
                  # track starts is valid and shows "0:00").
                  hidden: true
                  styles: text_muted
                  x: 19
                  y: 231
                  width: 215
                  height: 18
                  text: "0:00"
                  text_align: LEFT
                  long_mode: CLIP
                  text_font: ${font_body}
              - label:
                  id: mp_lbl_total
                  # Imp 7/8: hidden until a media duration exists.
                  hidden: true
                  styles: text_muted
                  x: 240
                  y: 231
                  width: 220
                  height: 18
                  text: "0:00"
                  text_align: RIGHT
                  long_mode: CLIP
                  text_font: ${font_body}
              - obj:
                  id: mp_controls
                  styles: controls_row
                  x: 10
                  y: 250
                  width: 460
                  height: 44
                  pad_all: 0
                  scrollbar_mode: "OFF"
                  widgets:
                    - button:
                        id: mp_btn_prev
                        styles: icon_button
                        x: 0
                        y: 4
                        width: 40
                        height: 40
                        on_press:
                          # previous STATION (wrap 1 -> station_count); URL source
                          # is chosen by the play_station script (HA vs offline)
                          - lambda: 'id(current_station) = ((id(current_station) + ${station_count} - 2) % ${station_count}) + 1;'
                          - script.execute: play_station
                        widgets:
                          - label:
                              align: CENTER
                              text: ${text_skip_prev}
                              text_font: menu32
                              text_color: ${color_text_primary}
                    - button:
                        id: mp_btn_play
                        styles: primary_button
                        x: 44
                        y: 0
                        width: 100
                        height: 40
                        on_press:
                          # DBG (kept by request): log what this button does in each
                          # mode. ha=1 routes through HA; ha=0 (wifi-only) falls back
                          # to the native media_player actions below.
                          - logger.log:
                              format: "DBG play/pause: ha_connected=%d player_playing=%d"
                              args: ["id(ha_connected)", "id(player_playing)"]
                          # Play/pause toggling works via the native play-state
                          # triggers (player_playing) in every mode; the HA action
                          # itself is only valid while the API is connected.
                          - if:
                              condition:
                                lambda: 'return id(ha_connected);'
                              then:
                                - if:
                                    condition:
                                      lambda: 'return id(player_playing);'
                                    then:
                                      - logger.log: "DBG play/pause: HA branch -> media_pause"
                                      - homeassistant.action:
                                          action: media_player.media_pause
                                          data:
                                            entity_id: media_player.esp_media_player
                                    else:
                                      - logger.log: "DBG play/pause: HA branch -> media_play"
                                      - homeassistant.action:
                                          action: media_player.media_play
                                          data:
                                            entity_id: media_player.esp_media_player
                              else:
                                # wifi-only / no-HA mode: route through the native
                                # media player actions (HA service calls would be a
                                # no-op here). `player_playing` mirrors the native
                                # play-state triggers in every mode, so the toggle
                                # decision is identical to the HA branch above.
                                - if:
                                    condition:
                                      lambda: 'return id(player_playing);'
                                    then:
                                      - logger.log: "DBG play/pause: native pause (wifi-only)"
                                      - media_player.pause:
                                          id: esp_media_player
                                    else:
                                      - logger.log: "DBG play/pause: native play (wifi-only)"
                                      - media_player.play:
                                          id: esp_media_player
                        widgets:
                          - label:
                              id: mp_lbl_play_icon
                              align: CENTER
                              text: ${text_play}
                              text_font: menu32
                              text_color: ${color_text_primary}
                    - button:
                        id: mp_btn_next
                        styles: icon_button
                        x: 148
                        y: 4
                        width: 40
                        height: 40
                        on_press:
                          # next STATION (wrap station_count -> 1); URL source
                          # is chosen by the play_station script (HA vs offline)
                          - lambda: 'id(current_station) = (id(current_station) % ${station_count}) + 1;'
                          - script.execute: play_station
                        widgets:
                          - label:
                              align: CENTER
                              text: ${text_skip_next}
                              text_font: menu32
                              text_color: ${color_text_primary}
                    - button:
                        id: mp_btn_vol_down
                        styles: icon_button
                        x: 342
                        y: 4
                        width: 40
                        height: 40
                        on_press:
                          # Native step -5% (volume_increment: 0.05). Pure
                          # command - the on_volume trigger syncs slider +
                          # percent label. Works in HA and wifi-only mode.
                          # Unmute first, then step down (pressing past 0 also
                          # clears the muted state).
                          - if:
                              condition:
                                lambda: 'return id(volume_muted);'
                              then:
                                - media_player.volume_mute:
                                    id: esp_media_player
                                    state: OFF
                          - media_player.volume_down:
                              id: esp_media_player
                          - script.execute: show_volume_popup
                        widgets:
                          - label:
                              align: CENTER
                              text: ${text_volume_minus}
                              text_font: menu32
                              text_color: ${color_text_primary}
                    - button:
                        id: mp_btn_mute
                        styles: icon_button
                        x: 386
                        y: 4
                        width: 40
                        height: 40
                        on_press:
                          # Native mute toggle. Pure command - the on_mute /
                          # on_unmute triggers (esp-web-radio-audio.yaml) handle
                          # the glyph color, `dac_mute` hardware mute and the
                          # guarded HA push. Deliberately does NOT open the
                          # volume popup - muting is confirmed by the orange
                          # glyph (behavior unchanged from before the refactor).
                          # Build-time check item: `media_player.volume_mute`
                          # uses `state: ON/OFF`; if the installed ESPHome
                          # expects `muted: true/false` instead, adapt both this
                          # handler and the volume_slider handler below.
                          - if:
                              condition:
                                lambda: 'return id(volume_muted);'
                              then:
                                - media_player.volume_mute:
                                    id: esp_media_player
                                    state: OFF
                              else:
                                - media_player.volume_mute:
                                    id: esp_media_player
                                    state: ON
                        widgets:
                          - label:
                              id: mp_lbl_mute_icon
                              align: CENTER
                              text: ${text_volume_off}
                              text_font: menu32
                              # Gray accent while unmuted; on_mute switches it to
                              # the orange accent, on_unmute back to gray.
                              text_color: ${color_text_muted}
                    - button:
                        id: mp_btn_vol_up
                        styles: icon_button
                        x: 430
                        y: 4
                        width: 40
                        height: 40
                        on_press:
                          # Native step +5% (volume_increment: 0.05). Pure
                          # command - the on_volume trigger syncs slider +
                          # percent label. If currently muted, unmute first,
                          # then step up.
                          - if:
                              condition:
                                lambda: 'return id(volume_muted);'
                              then:
                                - media_player.volume_mute:
                                    id: esp_media_player
                                    state: OFF
                          - media_player.volume_up:
                              id: esp_media_player
                          - script.execute: show_volume_popup
                        widgets:
                          - label:
                              align: CENTER
                              text: ${text_volume_plus}
                              text_font: menu32
                              text_color: ${color_text_primary}
              # Volume popup overlay (Fix 3): horizontal slider near the bottom,
              # drawn LAST inside mp_card so it renders on top of page content.
              # Hidden by default; shown by show_volume_popup for 5 s after each
              # -/+ press / slider interaction. Absolutely positioned with fixed
              # dimensions (static-layout contract) - never affects siblings.
              - obj:
                  id: volume_popup
                  styles: panel
                  x: 50
                  y: 150
                  width: 380
                  height: 50
                  pad_all: 0
                  scrollbar_mode: "OFF"
                  clickable: true
                  hidden: true
                  widgets:
                    - slider:
                        id: volume_slider
                        x: 16
                        y: 12
                        width: 276
                        height: 24
                        min_value: 0
                        max_value: 100
                        value: 50
                        adv_hittest: true
                        on_release:
                          # Apply the dragged value (0..100 -> 0..1) via the
                          # native set_volume action - the on_volume trigger
                          # syncs slider + percent label. Dragging above 0 also
                          # unmutes. Restarts the 5 s auto-hide.
                          - if:
                              condition:
                                lambda: 'return x > 0 && id(volume_muted);'
                              then:
                                - media_player.volume_mute:
                                    id: esp_media_player
                                    state: OFF
                          - media_player.volume_set:
                              id: esp_media_player
                              volume: !lambda 'return x / 100.0f;'
                          - script.execute: show_volume_popup
                    - label:
                        id: mp_lbl_volume
                        x: 302
                        y: 13
                        width: 62
                        height: 18
                        text: "50%"
                        text_align: RIGHT
                        long_mode: CLIP
                        text_font: ${font_body}
                        text_color: ${color_text_primary}