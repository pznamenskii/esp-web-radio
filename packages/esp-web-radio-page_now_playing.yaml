                          # triggers (player_playing) in every mode; the HA action
                          # itself is only valid while the API is connected.
                          - if:
                              condition:
                                lambda: 'return id(ha_connected);'
                              then:
                                - if:
                                    condition:
                                      lambda: 'return id(player_playing);'
                                    then:
                                      - logger.log: "DBG play/pause: HA branch -> media_pause"
                                      - homeassistant.action:
                                          action: media_player.media_pause
                                          data:
                                            entity_id: media_player.esp_media_player
                                    else:
                                      - logger.log: "DBG play/pause: HA branch -> media_play"
                                      - homeassistant.action:
                                          action: media_player.media_play
                                          data:
                                            entity_id: media_player.esp_media_player
                              else:
                                # wifi-only / no-HA mode: route through the native
                                # media player actions (HA service calls would be a
                                # no-op here). `player_playing` mirrors the native
                                # play-state triggers in every mode, so the toggle
                                # decision is identical to the HA branch above.
                                - if:
                                    condition:
                                      lambda: 'return id(player_playing);'
                                    then:
                                      - logger.log: "DBG play/pause: native pause (wifi-only)"
                                      - media_player.pause:
                                          id: esp_media_player
                                    else:
                                      - logger.log: "DBG play/pause: native play (wifi-only)"
                                      - media_player.play:
                                          id: esp_media_player
