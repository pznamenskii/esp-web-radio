                          # is chosen by the play_station script (HA vs offline)
                          - lambda: 'id(current_station) = (id(current_station) % ${station_count}) + 1;'
                          - script.execute: play_station
                        widgets:
                          - label:
                              align: CENTER
                              text: ${text_skip_next}
                              text_font: menu32
                              text_color: ${color_text_primary}
                    - button:
                        id: mp_btn_vol_down
                        styles: icon_button
                        x: 342
                        y: 4
                        width: 40
                        height: 40
                        on_press:
                          # Native step -5% (volume_increment: 0.05). Pure
                          # command - the on_volume trigger syncs slider +
                          # percent label. Works in HA and wifi-only mode.
                          # Unmute first, then step down (pressing past 0 also
                          # clears the muted state).
                          - if:
                              condition:
                                lambda: 'return id(volume_muted);'
                              then:
                                - media_player.volume_mute:
                                    id: esp_media_player
                                    state: OFF
                          - media_player.volume_down:
                              id: esp_media_player
                          - script.execute: show_volume_popup
                        widgets:
                          - label:
                              align: CENTER
                              text: ${text_volume_minus}
                              text_font: menu32
                              text_color: ${color_text_primary}
                    - button:
                        id: mp_btn_mute
                        styles: icon_button
                        x: 386
                        y: 4
                        width: 40
                        height: 40
                        on_press:
                          # Native mute toggle. Pure command - the on_mute /
                          # on_unmute triggers (esp-web-radio-audio.yaml) handle
                          # the glyph color, `dac_mute` hardware mute and the
                          # guarded HA push. Deliberately does NOT open the
                          # volume popup - muting is confirmed by the orange
                          # glyph (behavior unchanged from before the refactor).
                          # Build-time check item: `media_player.volume_mute`
                          # uses `state: ON/OFF`; if the installed ESPHome
                          # expects `muted: true/false` instead, adapt both this
                          # handler and the volume_slider handler below.
                          - if:
                              condition:
                                lambda: 'return id(volume_muted);'
                              then:
                                - media_player.volume_mute:
                                    id: esp_media_player
                                    state: OFF
                              else:
                                - media_player.volume_mute:
                                    id: esp_media_player
                                    state: ON
                        widgets:
                          - label:
                              id: mp_lbl_mute_icon
                              align: CENTER
                              text: ${text_volume_off}
                              text_font: menu32
                              # Gray accent while unmuted; on_mute switches it to
                              # the orange accent, on_unmute back to gray.
                              text_color: ${color_text_muted}
                    - button:
                        id: mp_btn_vol_up
                        styles: icon_button
                        x: 430
                        y: 4
                        width: 40
                        height: 40
                        on_press:
                          # Native step +5% (volume_increment: 0.05). Pure
                          # command - the on_volume trigger syncs slider +
                          # percent label. If currently muted, unmute first,
                          # then step up.
                          - if:
                              condition:
                                lambda: 'return id(volume_muted);'
                              then:
                                - media_player.volume_mute:
                                    id: esp_media_player
                                    state: OFF
                          - media_player.volume_up:
                              id: esp_media_player
                          - script.execute: show_volume_popup
                        widgets:
                          - label:
                              align: CENTER
                              text: ${text_volume_plus}
                              text_font: menu32
                              text_color: ${color_text_primary}
              # Volume popup overlay (Fix 3): horizontal slider near the bottom,
              # drawn LAST inside mp_card so it renders on top of page content.
              # Hidden by default; shown by show_volume_popup for 5 s after each
              # -/+ press / slider interaction. Absolutely positioned with fixed
              # dimensions (static-layout contract) - never affects siblings.
              - obj:
                  id: volume_popup
                  styles: panel
                  x: 50
                  y: 150
                  width: 380
                  height: 50
                  pad_all: 0
                  scrollbar_mode: "OFF"
                  clickable: true
                  hidden: true
                  widgets:
                    - slider:
                        id: volume_slider
                        x: 16
                        y: 12
                        width: 276
                        height: 24
                        min_value: 0
                        max_value: 100
                        value: 50
                        adv_hittest: true
                        on_release:
                          # Apply the dragged value (0..100 -> 0..1) via the
                          # native set_volume action - the on_volume trigger
                          # syncs slider + percent label. Dragging above 0 also
                          # unmutes. Restarts the 5 s auto-hide.
                          - if:
                              condition:
                                lambda: 'return x > 0 && id(volume_muted);'
                              then:
                                - media_player.volume_mute:
                                    id: esp_media_player
                                    state: OFF
                          - media_player.volume_set:
                              id: esp_media_player
                              volume: !lambda 'return x / 100.0f;'
                          - script.execute: show_volume_popup
                    - label:
                        id: mp_lbl_volume
                        x: 302
                        y: 13
                        width: 62
                        height: 18
                        text: "50%"
                        text_align: RIGHT
                        long_mode: CLIP
                        text_font: ${font_body}
                        text_color: ${color_text_primary}

# ---------------------------------------------------------------------------
# Visualizer animation driver (plans/visualizer.md): the spectrum_tap custom
# speaker (esp-web-radio-audio.yaml) taps the mixed PCM in play(), computes a
# 128-point FFT in its loop() and publishes 16 power bands in spec_bands[]
# (custom_components/spectrum_tap/spectrum.cpp). This interval samples those
# bands at 25 fps (40 ms) and animates the 16 mp_visualizer bars with
# attack/decay smoothing - fast rise, slow fall, same tuning as the plan
# (GAIN 300.0f, attack 0.5, decay 0.85).
#
# Integration with the existing show/hide triggers: the guards are the
# `visualizer_enabled` toggle (Info/Settings page persisted global) AND the
# widget visibility itself - on_play shows mp_visualizer only while enabled,
# on_pause/on_idle hide it unconditionally (esp-web-radio-audio.yaml), so
# while disabled or hidden this interval does no work (one flag check per
# tick). The FFT itself only runs while play() flows, i.e. while audio is
# actually playing - when paused/idle no new bands are produced and no bar
# updates happen. LVGL is skipped while the idle snow screen is up
# (lvgl.is_paused).
# ---------------------------------------------------------------------------
interval:
  - id: viz_animation
    interval: 40ms
    then:
      - if:
          condition:
            and:
              - lambda: 'return id(visualizer_enabled) && !lv_obj_has_flag(id(mp_visualizer), LV_OBJ_FLAG_HIDDEN);'
              - not:
                  - lvgl.is_paused
          then:
            - lambda: |-
                // FFT output of custom_components/spectrum_tap (spectrum.cpp):
                // 16 logarithmic bands covering ~375 Hz - 18 kHz (48 kHz /
                // 128-point FFT), power-domain magnitude. Global symbol
                // defined in spectrum.cpp; declared here for the lambda TU.
                extern float spec_bands[16];

                // Resolve the 16 YAML-declared bar objects once (ids are
                // generated member expressions - they must not be re-evaluated
                // through a nested capture, hence the static array).
                static lv_obj_t *viz_bars[16] = {nullptr};
                if (viz_bars[0] == nullptr) {
                  viz_bars[0] = id(viz_bar_0);
                  viz_bars[1] = id(viz_bar_1);
                  viz_bars[2] = id(viz_bar_2);
                  viz_bars[3] = id(viz_bar_3);
                  viz_bars[4] = id(viz_bar_4);
                  viz_bars[5] = id(viz_bar_5);
                  viz_bars[6] = id(viz_bar_6);
                  viz_bars[7] = id(viz_bar_7);
                  viz_bars[8] = id(viz_bar_8);
                  viz_bars[9] = id(viz_bar_9);
                  viz_bars[10] = id(viz_bar_10);
                  viz_bars[11] = id(viz_bar_11);
                  viz_bars[12] = id(viz_bar_12);
                  viz_bars[13] = id(viz_bar_13);
                  viz_bars[14] = id(viz_bar_14);
                  viz_bars[15] = id(viz_bar_15);
                }

                // Per-band attack/decay smoothing (fast rise, slow fall).
                static float viz_smooth[16] = {0.0f};
                for (int b = 0; b < 16; b++) {
                  float target = sqrtf(spec_bands[b]) * 300.0f;
                  if (target > viz_smooth[b])
                    viz_smooth[b] = viz_smooth[b] * 0.5f + target * 0.5f;
                  else
                    viz_smooth[b] = viz_smooth[b] * 0.85f;
                  int h = (int) viz_smooth[b];
                  if (h < 2) h = 2;
                  if (h > 70) h = 70;   // strip is 75 px tall, 3 px top pad
                  // Bottom-anchored: fixed x (15 + b*28), y grows upward.
                  lv_obj_set_pos(viz_bars[b], 15 + b * 28, 75 - h - 3);
                  lv_obj_set_height(viz_bars[b], h);
                }