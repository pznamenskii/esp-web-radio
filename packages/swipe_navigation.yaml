# ==============================================================================
# swipe_navigation.yaml - shared page swipe handlers
#
# Included by every navigable page via `<<: !include swipe_navigation.yaml`.
# Handlers live on the PAGES, not on top_layer: LVGL delivers gesture events
# to the object under the finger (page content) and bubbles them up to the page
# screen; top_layer never receives them (logs/log_2040.txt).
#
# wifi.ap_active guard: no navigation while the fallback AP / setup page is
# active; page_ap_setup has `skip: true` and does not include this file.
#
# After each swipe the bottom nav indicator is refocused using modulo
# `${swipeable_page_count}` math: three swipeable pages now - Now Playing(0),
# Stations(1), Settings(2); `page_wrap: true` wraps around (left from Settings
# -> Now Playing, right from Now Playing -> Settings). page_ap_setup is skipped
# by lvgl.page.next/previous so it never enters the sequence.
# ==============================================================================

on_swipe_left:
  - if:
      condition:
        not:
          - wifi.ap_active
      then:
        - lambda: 'lv_indev_wait_release(lv_indev_get_act());'
        - lvgl.page.next:
            animation: OUT_LEFT
            time: 300ms
        - lambda: 'id(current_page) = (id(current_page) + 1) % ${swipeable_page_count};'
        - script.execute: update_nav_indicator
        # Lazy logo fetch (failsafe): station logo downloads NEVER run at boot -
        # only here, when the Stations page is actually opened (current_page == 1).
        # The refresh_station_images script itself debounces, serializes the
        # fetches (1 s apart) and logs failures - a bad logo can never disturb
        # boot, playback or the rest of the UI.
        - if:
            condition:
              lambda: 'return id(current_page) == 1;'
            then:
              - script.execute: refresh_station_images

on_swipe_right:
  - if:
      condition:
        not:
          - wifi.ap_active
      then:
        - lambda: 'lv_indev_wait_release(lv_indev_get_act());'
        - lvgl.page.previous:
            animation: OUT_RIGHT
            time: 300ms
        - lambda: 'id(current_page) = (id(current_page) + ${swipeable_page_count} - 1) % ${swipeable_page_count};'
        - script.execute: update_nav_indicator
        # Lazy logo fetch - see the on_swipe_left comment above.
        - if:
            condition:
              lambda: 'return id(current_page) == 1;'
            then:
              - script.execute: refresh_station_images