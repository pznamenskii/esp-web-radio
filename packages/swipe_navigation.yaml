# ==============================================================================
# swipe_navigation.yaml - shared page swipe handlers
#
# Included by every navigable page via:
#   <<: !include swipe_navigation.yaml
#
# Why the handlers live on the PAGES and not on top_layer: LVGL delivers
# gesture (LV_EVENT_GESTURE) events to the object under the finger — the page
# content — and bubbles them up to the page screen. top_layer never receives
# them (validated empirically in logs/log_2040.txt: page-level probes fired
# while the top_layer handlers stayed completely silent).
#
# The wifi.ap_active guard keeps navigation out while the fallback AP / setup
# page is active; page_ap_setup itself has `skip: true` and does NOT include
# this file, so it can never be reached by swiping.
# ==============================================================================

on_swipe_left:
  - if:
      condition:
        not:
          - wifi.ap_active
      then:
        - lambda: 'lv_indev_wait_release(lv_indev_get_act());'
        - lvgl.page.next:
            animation: OUT_LEFT
            time: 300ms

on_swipe_right:
  - if:
      condition:
        not:
          - wifi.ap_active
      then:
        - lambda: 'lv_indev_wait_release(lv_indev_get_act());'
        - lvgl.page.previous:
            animation: OUT_RIGHT
            time: 300ms