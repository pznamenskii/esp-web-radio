# ==============================================================================
# homeassistant.yaml - time source, status sensors, and Home Assistant exposure
#
# The native API (with encryption) is configured in the main file, which exposes
# the media_player, the Radio Station `select`, the "Now Playing" text sensor
# and the DAC mute switch to Home Assistant automatically.
#
# Every on_value handler here targets widgets of the Now Playing page
# (page_now_playing) - see esp-web-radio-page_now_playing.yaml for geometry.
# ==============================================================================

# ---------------------------------------------------------------------------
# Time sources for the on-screen clock (`lbl_time`): HA time (`esptime`) while
# the API is connected, otherwise local NTP time (`wifi_time`) while WiFi is up.
# Source selection lives in the `update_clock` script (see README).
# ---------------------------------------------------------------------------
time:
  - platform: homeassistant
    id: esptime
    timezone: !secret timezone
    on_time:
      - seconds: 0
        then:
          - script.execute: update_clock

  - platform: sntp
    id: wifi_time
    timezone: !secret timezone
    servers:
      - "pool.ntp.org"
      - "time.google.com"
    on_time_sync:
      - script.execute: update_clock
    on_time:
      - seconds: 0
        then:
          - script.execute: update_clock

