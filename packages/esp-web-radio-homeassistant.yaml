# Громкость (float 0..1 -> int 0..100) -> popup-слайдер громкости
# NOTE 2 PULL path (volume): HA-originated volume changes are mirrored into the
# local `volume_level` global AND the popup slider + percent label, so both stay
# in sync in both directions. Receive-only: this handler never calls
# homeassistant.action. `volume_last_pushed` is adopted here so the HA echo of
# a local push is recognized as already-pushed (loop protection, see the
# `volume_set` script in esp-web-radio-page_now_playing.yaml).
  - platform: homeassistant
    id: player_volume
    entity_id: media_player.esp_media_player
    attribute: volume_level
    on_value:
      - lambda: |-
          id(volume_level) = x;
          if (!id(volume_muted)) id(volume_before_mute) = x;
          id(volume_last_pushed) = x;
      - lvgl.slider.update:
          id: volume_slider
          value: !lambda return int(x * 100);
      - lvgl.label.update:
          id: mp_lbl_volume
          text: !lambda |-
            int v = (int)(x * 100.0f);
            char buf[8];
            snprintf(buf, sizeof(buf), "%d%%", v);
            return buf;

  # NOTE 2 PULL path (mute): HA-originated mute/unmute (`is_volume_muted`
  # attribute) is mirrored into the local `volume_muted` global, the hardware
  # `dac_mute` switch (GPIO7 / PCM5102 XSMT) and the mute icon. Unmuting with a
  # zeroed local level restores the remembered pre-mute volume. Receive-only
  # (never calls homeassistant.action) and adopts echoed values into
  # `volume_mute_last_pushed`. Requires the media_player entity to expose the
  # `is_volume_muted` attribute; if the platform does not, this sensor stays
  # unknown and mute sync falls back to the volume-level path (muted == 0).
  - platform: homeassistant
    id: player_muted
    entity_id: media_player.esp_media_player
    attribute: is_volume_muted
    on_value:
      - lambda: |-
          id(volume_muted) = (x > 0.5f);
          id(volume_mute_last_pushed) = id(volume_muted);
      - if:
          condition:
            lambda: 'return id(volume_muted);'
          then:
            - switch.turn_on: dac_mute
          else:
            - switch.turn_off: dac_mute
            - if:
                condition:
                  lambda: 'return id(volume_level) <= 0.0f && id(volume_before_mute) > 0.0f;'
                then:
                  - lambda: 'id(volume_level) = id(volume_before_mute);'
                  - script.execute: volume_set
      - lambda: |-
          if (id(volume_muted)) {
            lv_obj_set_style_text_color(id(mp_lbl_mute_icon), lv_color_hex(${color_accent}), 0);
          } else {
            lv_obj_set_style_text_color(id(mp_lbl_mute_icon), lv_color_hex(${color_text_muted}), 0);
          }

  # Позиция трека -> прогресс-бар + elapsed (mm:ss)
  - platform: homeassistant
    id: player_position
    entity_id: media_player.esp_media_player
    attribute: media_position
    on_value:
      - lvgl.bar.update:
          id: mp_bar_progress
          value: !lambda |-
            float dur = id(player_duration).state;
            if (dur <= 0.0f) return 0;
            int pct = (int)(x / dur * 100.0f);
            if (pct > 100) pct = 100;
            return pct;
      - lvgl.label.update:
          id: mp_lbl_elapsed
          text: !lambda |-
            int t = (int)x;
            char buf[16];
            snprintf(buf, sizeof(buf), "%d:%02d", t / 60, t % 60);
            return buf;

  # Длительность трека -> total (mm:ss) + прогресс-бар
  - platform: homeassistant
    id: player_duration
    entity_id: media_player.esp_media_player
    attribute: media_duration
    on_value:
      - lvgl.label.update:
          id: mp_lbl_total
          text: !lambda |-
            int t = (int)x;
            char buf[16];
            snprintf(buf, sizeof(buf), "%d:%02d", t / 60, t % 60);
            return buf;
      - lvgl.bar.update:
          id: mp_bar_progress
          value: !lambda |-
            float dur = x;
            if (dur <= 0.0f) return 0;
            float pos = id(player_position).state;
            int pct = (int)(pos / dur * 100.0f);
            if (pct > 100) pct = 100;
            return pct;

# ---------------------------------------------------------------------------
# Global: current radio station (1..4), used by mp_btn_prev / mp_btn_next on
# the Now Playing page to cycle through station_1_url .. station_4_url.
# ---------------------------------------------------------------------------
globals:
  - id: current_station
    type: int
    restore_value: no
    initial_value: "1"
  # True while a Home Assistant client is connected; selects `esptime` for the
  # title-bar clock (see `update_clock` script).
  - id: ha_connected
    type: bool
    restore_value: no
    initial_value: "false"
  # True while the local media player reports state "playing" (updated by the
  # media_player.on_play/on_pause/on_idle triggers in esp-web-radio-audio.yaml);
  # drives play/pause UI in every mode, including when HA is unreachable.
  - id: player_playing
    type: bool
    restore_value: no
    initial_value: "false"