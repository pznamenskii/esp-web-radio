  # Station logo paths (third parameter of the station set, "Radio Station N
  # Image" HA sensors): config-relative paths like "www/config/radio-N.png".
  # refresh_stations converts them to <ha_url>/local/... URLs and pushes them
  # into the online_image stubs (esp-web-radio-station_images.yaml); an empty
  # or unknown value keeps the tinted placeholder slot. Re-running the refresh
  # on value change makes late-arriving sensors download without a reconnect.
