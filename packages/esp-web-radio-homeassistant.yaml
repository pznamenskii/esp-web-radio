  # Player state -> play/pause glyph on the central button (also mirrored by
  # the native media_player play-state triggers in esp-web-radio-audio.yaml;
  # both reflect the same truth).
  - platform: homeassistant
    id: player_state
    entity_id: media_player.esp_media_player
    on_value:
      - if:
          condition:
            lambda: return x == "playing";
          then:
            - lvgl.label.update:
                id: mp_lbl_play_icon
                text: ${text_pause}
      - if:
          condition:
            lambda: return x != "playing";
          then:
            - lvgl.label.update:
                id: mp_lbl_play_icon
                text: ${text_play}

  # Station name (large page title): driven ONLY by our own `station_N_name`
  # sensors via the `play_station` immediate update. The MA mirror's radio
  # metadata proved unstable across streams (media_title / media_album_name
  # swap between station and song as ICY updates arrive), so no MA attribute is
  # a reliable station-name source and the old MA-driven title overwrite was
  # removed. Known trade-off: when playback is started from the MA UI (not from
  # the device), the title keeps the previous station name until the next
  # device-initiated play. The MA mirror attributes are still used for
  # artist/track/cover below. player_state (above) stays on
  # media_player.esp_media_player - the play/pause glyph is already driven by
  # the native on_play/on_pause/on_idle triggers.

  # Artist (hidden when empty) - from the MA mirror (${ma_player_entity}):
  # while playback is controlled by Music Assistant the media_* attributes are
  # populated there, not on the raw ESPHome entity.
  - platform: homeassistant
    id: now_playing_artist
    entity_id: ${ma_player_entity}
    attribute: media_artist
    on_value:
      - if:
          condition:
            lambda: return x.length() > 0;
          then:
            - lvgl.label.update:
                id: mp_now_playing_artist
                text: !lambda return x.c_str();
            - lvgl.widget.show: mp_now_playing_artist
          else:
            - lvgl.widget.hide: mp_now_playing_artist

  # Track (hidden when empty or when it still equals the station title). MA
  # radio: the mirror's media_title starts as the station name and is replaced
  # by the ICY song info a few seconds into playback (streams without ICY keep
  # the station name forever). Comparing against mp_station_title suppresses
  # the stale station value; the label re-appears once real track metadata
  # arrives.
  - platform: homeassistant
    id: now_playing_track
    entity_id: ${ma_player_entity}
    attribute: media_title
    on_value:
      - if:
          condition:
            lambda: 'return x.length() > 0 && x != lv_label_get_text(id(mp_station_title));'
          then:
            - lvgl.label.update:
                id: mp_now_playing_track
                text: !lambda return x.c_str();
            - lvgl.widget.show: mp_now_playing_track
          else:
            - lvgl.widget.hide: mp_now_playing_track

  # Album-art presence (media_image_url attribute) -> show/hide mp_now_playing_art.
  # The panel is a placeholder while art metadata exists; rendering the image is
  # a later roadmap item. Fallback attribute name: entity_picture.
  - platform: homeassistant
    id: now_playing_art
    entity_id: ${ma_player_entity}
    attribute: media_image_url
    on_value:
      - if:
          condition:
            lambda: return x.length() > 0;
          then:
            - lvgl.widget.show: mp_now_playing_art
          else:
            - lvgl.widget.hide: mp_now_playing_art

  - platform: homeassistant
    entity_id: media_player.esp_media_player
    name: "Media Player State"
    id: media_player_state

  # Human-readable uptime for the Info/Settings page (driven by the
  # `uptime_sec` sensor; also published to HA). Updates every 60 s; format:
  # Xd Xh Xm /
  # Xh Xm / Xm. Re-added from the pre-cleanup state (comment cleanup removed
  # it while no Settings page existed - it targeted settings_uptime_value).
  - platform: template
    id: uptime_human
    name: "Uptime Human"
    update_interval: 60s
    lambda: |-
      int seconds = (int) id(uptime_sec).state;
      int days = seconds / 86400;
      int hours = (seconds % 86400) / 3600;
      int minutes = (seconds % 3600) / 60;
      char buffer[32];
      if (days > 0) {
        snprintf(buffer, sizeof(buffer), "%dd %dh %dm", days, hours, minutes);
      } else if (hours > 0) {
        snprintf(buffer, sizeof(buffer), "%dh %dm", hours, minutes);
      } else {
        snprintf(buffer, sizeof(buffer), "%dm", minutes);
      }
      return buffer;
    on_value:
      - script.execute: refresh_settings_info

sensor:
  # Track position -> elapsed (mm:ss) + progress-bar percent.
  # Elapsed is shown whenever a position value exists (0 at track start is a
  # valid known value and must display); the progress bar needs a known
  # duration as its range, so it shows only while player_duration has a state.
  # When the player stops, HA clears the attributes -> sensors report unknown
  # (no on_value fires) and the media_player on_idle trigger hides the cluster.
  - platform: homeassistant
    id: player_position
    entity_id: media_player.esp_media_player
    attribute: media_position
    on_value:
      - lvgl.widget.show: mp_lbl_elapsed
      - lvgl.label.update:
          id: mp_lbl_elapsed
          text: !lambda |-
            int t = (int)x;
            char buf[16];
            snprintf(buf, sizeof(buf), "%d:%02d", t / 60, t % 60);
            return buf;
      - if:
          condition:
            lambda: 'return id(player_duration).has_state() && id(player_duration).state > 0.0f;'
          then:
            - lvgl.widget.show: mp_bar_progress
            - lvgl.bar.update:
                id: mp_bar_progress
                value: !lambda |-
                  float dur = id(player_duration).state;
                  int pct = (int)(x / dur * 100.0f);
                  if (pct > 100) pct = 100;
                  return pct;
          else:
            - lvgl.widget.hide: mp_bar_progress

  # Track duration -> total (mm:ss) + progress-bar range (bar shows whenever a
  # duration exists; a missing position simply renders 0%).
  - platform: homeassistant
    id: player_duration
    entity_id: media_player.esp_media_player
    attribute: media_duration
    on_value:
      - lvgl.widget.show: mp_lbl_total
      - lvgl.label.update:
          id: mp_lbl_total
          text: !lambda |-
            int t = (int)x;
            char buf[16];
            snprintf(buf, sizeof(buf), "%d:%02d", t / 60, t % 60);
            return buf;
      - lvgl.widget.show: mp_bar_progress
      - lvgl.bar.update:
          id: mp_bar_progress
          value: !lambda |-
            float pos = id(player_position).has_state() ? id(player_position).state : 0.0f;
            int pct = (int)(pos / x * 100.0f);
            if (pct > 100) pct = 100;
            return pct;

  # Local WiFi RSSI (dBm) - feeds the Info/Settings page strength icon + dBm
  # label (refresh_settings_info script in esp-web-radio-page_settings.yaml).
  # Measured by the ESP32 radio itself, so it works in wifi_only/no-HA mode
  # too; publishes no state while disconnected (the refresh script dims the
  # row). Re-added from the pre-cleanup state.
  - platform: wifi_signal
    id: wifi_level
    name: "WiFi Signal"
    update_interval: 60s
    on_value:
      - script.execute: refresh_settings_info

  # Uptime in seconds - source for the uptime_human text sensor above.
  - platform: uptime
    id: uptime_sec
    name: "Uptime"
    update_interval: 60s

# ---------------------------------------------------------------------------
# Playback/UI state globals. Connectivity flags live in
# esp-web-radio-lvgl_ui.yaml; the native play-state triggers live in
# esp-web-radio-audio.yaml.
# ---------------------------------------------------------------------------
globals:
  # Current radio station (1..station_count); cycled by mp_btn_prev/next and
  # set by the Stations page slots; read by the play_station script.
  - id: current_station
    type: int
    restore_value: no
    initial_value: "1"
  # True while a Home Assistant client is connected; selects `esptime` for the
  # title-bar clock (see `update_clock` script).
  - id: ha_connected
    type: bool
    restore_value: no
    initial_value: "false"
  # True while the local media player reports state "playing" (updated by the
  # media_player.on_play/on_pause/on_idle triggers in esp-web-radio-audio.yaml);
  # drives play/pause UI in every mode, including when HA is unreachable.
  - id: player_playing
    type: bool
    restore_value: no
    initial_value: "false"