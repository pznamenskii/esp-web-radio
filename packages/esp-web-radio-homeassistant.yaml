  # Состояние плеера -> иконка play/pause на центральной кнопке
  - platform: homeassistant
    id: player_state
    entity_id: media_player.esp_media_player
    on_value:
      - if:
          condition:
            lambda: return x == "playing";
          then:
            - lvgl.label.update:
                id: mp_lbl_play_icon
                text: ${text_pause}
      - if:
          condition:
            lambda: return x != "playing";
          then:
            - lvgl.label.update:
                id: mp_lbl_play_icon
                text: ${text_play}

  # Станция (большой заголовок страницы)
