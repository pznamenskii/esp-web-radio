      - if:
          condition:
            lambda: 'return id(ha_connected) && id(station_10_img).has_state() && id(station_10_img).state.length() > 0;'
          then:
            - online_image.set_url:
                id: station_img_10
                url: !lambda |-
                  std::string p = id(station_10_img).state;
                  if (p.rfind("www/", 0) == 0) p.erase(0, 4);
                  if (p.rfind("http", 0) == 0) return p;  // absolute URL - as-is
                  return std::string("${ha_url}") + "/local/" + p;
      - if:
          condition:
            lambda: 'return id(ha_connected) && id(station_11_img).has_state() && id(station_11_img).state.length() > 0;'
