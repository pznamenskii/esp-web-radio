                  return std::string("${ha_url}") + "/local/" + p;

  # ---------------------------------------------------------------------------
  # Play the station selected by the `current_station` global. Routing:
  #   - HA connected: homeassistant.action play_media against the Music Assistant
  #                   mirror (${ma_player_entity}); the media_content_id comes
  #                   from the HA template sensors (library://radio/<uuid>) with
  #                   media_content_type "music". Audio still flows into the
  #                   esp_media_player via the MA-served session stream.
  #   - no-HA mode:   native media_player.play_media with the direct
  #                   offline_station_N_url substitutions (no HA involved).
  # ---------------------------------------------------------------------------
  - id: play_station
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return id(ha_connected);'
          then:
            # Permanent diagnostic (kept by request): every HA-routed playback
            # command is logged with its station number and target entity, so
            # "station selection does not play" reports are diagnosable straight
            # from the device log. The two things to check against this line:
            # the entity must be the MA MIRROR of this device, and the station
            # number must match the tapped button.
            - logger.log:
                tag: diag
                format: "play_station: HA play_media station=%d entity=%s"
                args:
                  - 'id(current_station)'
                  - '"${ma_player_entity}"'
            - homeassistant.action:
                action: media_player.play_media
                data:
                  entity_id: ${ma_player_entity}
                  media_content_id: !lambda |-
                    int s = id(current_station);
                    if (s == 1) return id(station_1_url).state.c_str();
                    if (s == 2) return id(station_2_url).state.c_str();
                    if (s == 3) return id(station_3_url).state.c_str();
                    if (s == 4) return id(station_4_url).state.c_str();
                    if (s == 5) return id(station_5_url).state.c_str();
                    if (s == 6) return id(station_6_url).state.c_str();
                    if (s == 7) return id(station_7_url).state.c_str();
                    if (s == 8) return id(station_8_url).state.c_str();
                    if (s == 9) return id(station_9_url).state.c_str();
                    if (s == 10) return id(station_10_url).state.c_str();
                    if (s == 11) return id(station_11_url).state.c_str();
                    return id(station_12_url).state.c_str();
                  media_content_type: "music"
            - lvgl.label.update:
                id: mp_station_title
                text: !lambda |-
                  int s = id(current_station);
                  const char *name = nullptr;
                  if (s == 1 && id(station_1_name).has_state()) name = id(station_1_name).state.c_str();
                  else if (s == 2 && id(station_2_name).has_state()) name = id(station_2_name).state.c_str();
                  else if (s == 3 && id(station_3_name).has_state()) name = id(station_3_name).state.c_str();
                  else if (s == 4 && id(station_4_name).has_state()) name = id(station_4_name).state.c_str();
                  else if (s == 5 && id(station_5_name).has_state()) name = id(station_5_name).state.c_str();
                  else if (s == 6 && id(station_6_name).has_state()) name = id(station_6_name).state.c_str();
                  else if (s == 7 && id(station_7_name).has_state()) name = id(station_7_name).state.c_str();
                  else if (s == 8 && id(station_8_name).has_state()) name = id(station_8_name).state.c_str();
                  else if (s == 9 && id(station_9_name).has_state()) name = id(station_9_name).state.c_str();
                  else if (s == 10 && id(station_10_name).has_state()) name = id(station_10_name).state.c_str();
                  else if (s == 11 && id(station_11_name).has_state()) name = id(station_11_name).state.c_str();
                  else if (s == 12 && id(station_12_name).has_state()) name = id(station_12_name).state.c_str();
                  if (name != nullptr && name[0] != '\0')
                    return name;
                  // Sensor not (yet) known - keep the current label text
                  return lv_label_get_text(id(mp_station_title));
          else:
            - media_player.play_media:
                id: esp_media_player
                media_url: !lambda |-
                  int s = id(current_station);
                  if (s == 1) return "${offline_station_1_url}";
                  if (s == 2) return "${offline_station_2_url}";
                  if (s == 3) return "${offline_station_3_url}";
                  return "${offline_station_4_url}";
            - lvgl.label.update:   # no HA metadata offline - show our own title
                id: mp_station_title
                text: !lambda |-
                  int s = id(current_station);
                  if (s == 1) return "${offline_station_1_name}";
                  if (s == 2) return "${offline_station_2_name}";
                  if (s == 3) return "${offline_station_3_name}";
                  return "${offline_station_4_name}";
      - lvgl.page.show: ${homepage}   # back to Now Playing after selection
      - lambda: 'id(current_page) = 0;'
      - script.execute: update_nav_indicator

api:
  on_client_connected:
    - logger.log: "HA API connected"
    - if:
        condition:
          lambda: 'return (0 == client_info.find("Home Assistant "));'
        then:
          - lvgl.widget.show: lbl_hastatus
          - lambda: 'id(ha_connected) = true;'
          - script.execute: update_clock
          # wait for the station-name sensor states to arrive, then repopulate
          # the Stations page with the HA names
          - delay: 500ms
          - script.execute: refresh_stations
  on_client_disconnected:
  - logger.log: "HA API disconnected"
  - if:
      condition:
        lambda: 'return (0 == client_info.find("Home Assistant "));'
      then:
        - lvgl.widget.hide: lbl_hastatus
        - lambda: 'id(ha_connected) = false;'
        - script.execute: update_clock
        - script.execute: refresh_stations

wifi:
  on_connect:
    - logger.log: "WiFi connected"
    - lvgl.widget.hide: boot_screen
    - lvgl.widget.show: wifi_status
    - lvgl.label.update:
        id: wifi_status
        text: "${text_wifi}"
    - lambda: 'id(wifi_connected) = true;'
    - script.execute: update_clock
    - script.execute: refresh_stations   # offline names first; HA names arrive on api connect
    - script.execute: refresh_settings_info   # Info page: seed the WiFi row
    # Safety net: if we reconnect while the AP setup page is still up,
    # return to Now Playing immediately (the interval is dormant while connected).
    - if:
        condition:
          lambda: 'return id(ap_page_shown);'
        then:
          - script.stop: blink_wifi_status
          - lvgl.widget.show: top_layer
          - lvgl.page.show: ${homepage}
          - lambda: 'id(ap_page_shown) = false;'
          - lambda: 'id(current_page) = 0;'
          - script.execute: update_nav_indicator
  on_disconnect:
    - logger.log: "WiFi disconnected"
    - lvgl.widget.hide: wifi_status
    - lambda: 'id(wifi_connected) = false;'
    - script.execute: update_clock
    - script.execute: refresh_settings_info   # Info page: dim the WiFi row
    
ota:        # OTA progress bar popup
  - platform: esphome
    on_begin:
      then:
        - logger.log: "OTA started"
        - if:
            condition: lvgl.is_paused
            then:
              - logger.log: "LVGL resuming"          
              - lvgl.resume:
              - lvgl.widget.redraw:
              - light.turn_on: backlight
        - lvgl.widget.show: ota_popup
        - lambda: "id(backlight).loop();"
        - lambda: "id(mylvgl).loop();"
    on_progress:
        then:
          - lvgl.bar.update:
              id: ota_bar_percentage
              value: !lambda "return (int)x;"
          - lvgl.label.update:
              id: ota_lbl_percentage
              text:
                format: "завершено %0.1f%%"
                args: ["x"]
          - lambda: "id(backlight).loop();"
          - lambda: "id(mylvgl).loop();"

# ---------------------------------------------------------------------------
# AP state watcher: always-on; polls wifi.ap_active every 500 ms only while
# the station is offline (guarded by `wifi_connected`) with rising/falling-
# edge detection into the `ap_active` global. Always-on so the boot -> fallback
# AP window is covered even when no router is ever found (wifi.on_disconnect
# does not fire when the device never connected; interval.start/stop are not
# valid ESPHome actions).
# ---------------------------------------------------------------------------
interval:
  - id: ap_state_watch
    interval: 500ms
    then:
      - if:
          condition:
            lambda: 'return !id(wifi_connected);'
          then:
            - if:
                condition: wifi.ap_active
                then:
                  - if:
                      condition:
                        lambda: 'return !id(ap_active);'
                      then:                    # rising edge: AP just became active
                        - lambda: 'id(ap_active) = true;'
                        - script.execute: enter_ap_mode
                else:
                  - if:
                      condition:
                        lambda: 'return id(ap_active);'
                      then:                    # falling edge: AP just ended
                        - lambda: 'id(ap_active) = false;'
                        - script.execute: exit_ap_mode

# ---------------------------------------------------------------------------
# LVGL framework
# ---------------------------------------------------------------------------
lvgl:
  id: mylvgl
  rotation: 90 #landscape mode
  displays:
    - main_display
  touchscreens:
    - touchscreen_id: main_touch
  on_idle:   # turn off backlight on idle (skipped while AP mode is active)
    - timeout: ${idle_timeout}
      then:
        - if:
            condition:
              not:
                - wifi.ap_active
            then:
              - logger.log: LVGL is idle for ${idle_timeout}
              - light.turn_off:
                  id: backlight
                  transition_length: 5s
              - lvgl.pause:
                  show_snow: true     # LCD burnout protection

  default_font: f_body
  buffer_size: 25%

  bottom_layer:
    bg_color: ${color_surface_alt}
    bg_opa: COVER

  top_layer:        # cross-page status indicators + bottom nav indicator
    # Swipe navigation moved to the pages via common/swipe_navigation.yaml:
    # the top_layer never receives gesture events (see logs/log_2040.txt).
    # The bottom indicator (widget id: top_layer) replaces the old prev/home/
    # next buttonmatrix - it is a PURE indicator (clickable: false); page
    # navigation happens by swiping only.
    widgets:
      - obj:      # boot screen with rotating arc till wifi connects
          id: boot_screen
          x: 0
          y: 0
          width: 100%
          height: 100%
          bg_color: ${color_surface}
          bg_opa: COVER
          radius: 0
          pad_all: 0
          border_width: 0
          widgets:
            - spinner:
                align: CENTER
                height: 100
                width: 100
                spin_time: 1s
                arc_length: 60deg
                arc_width: 16
                indicator:
                  arc_color: ${color_accent}
                  arc_width: 16
          on_click:
            - logger.log: "[UI] CLICKED boot_screen dismiss"
            - lvgl.widget.hide: boot_screen
      - obj:      # OTA popup
          id: ota_popup
          hidden: true
          clickable: false
          x: 0
          y: 0
          width: 100%
          height: 100%
          pad_all: 10
          bg_color: ${color_panel}
          bg_opa: cover
          widgets:
            - label:
                id: ota_lbl_title
                x: 2
                y: 2
                text: "Идёт обновление"
            - label:
                id: ota_lbl_percentage
                x: 2
                y: 30
                width: 100%
                text: "0 %"
            - bar:
                id: ota_bar_percentage
                x: 2
                y: 60
                width: 100%
                height: 10
                max_value: 100
                min_value: 0
                value: 0
      - label:        # current time (HH:MM); source per `update_clock` script
          id: lbl_time
          hidden: true
          align: TOP_MID
          y: 2
          text: "00:00"
          text_font: ${font_body}
          text_color: ${color_text_primary}
      - label:        # WiFi status (plain wifi glyph while connected)
          id: wifi_status
          hidden: true
          align: TOP_RIGHT
          x: -5
          y: 0
          text: "${text_wifi}"
          text_font: menu24
          text_align: right
          text_color: ${color_text_primary}
      - label:        # HA API connection status
          id: lbl_hastatus
          hidden: true
          align: TOP_RIGHT
          x: -35
          y: 0
          text: ${text_hastatus}
          text_font: menu24
          text_align: right
          text_color: ${color_accent}
      # Bottom nav indicator: 1/3 of the screen wide, transparent, centered at
      # the screen bottom. Height = focused glyph (menu24 = 24 px) + 1 px pad;
      # top edge lands at y=294, exactly where the Now Playing controls row
      # (mp_controls, y 250 + 44) ends. Slots in page order: Now Playing,
      # Stations, Settings (real page since the Info/Settings implementation).
      # The focused slot shows its big
      # (menu24, accent) label, the others their small (nav20, muted) one -
      # swapping is done by update_nav_indicator (hide/show only, no reflow).
      - obj:
          id: top_layer
          align: bottom_mid
          y: 0
          width: 160                 # 1/3 of the 480 px screen
          height: 26                 # 24 px focused glyph + 1 px top/bottom
          bg_opa: TRANSP             # transparent background
          border_width: 0
          pad_all: 0
          clickable: false           # pure indicator - never intercepts touches
          widgets:
            - obj:      # slot 1 - Now Playing (mdi-play-circle-outline)
                id: nav_slot_playing
                x: 0
                y: 0
                width: 53
                height: 26
                bg_opa: TRANSP
                border_width: 0
                pad_all: 0
                clickable: false
                widgets:
                  - label:
                      id: nav_lbl_playing_big
                      align: CENTER
                      text: ${text_nav_playing}
                      text_font: menu24
                      text_color: ${color_accent}
                  - label:
                      id: nav_lbl_playing_small
                      align: CENTER
                      text: ${text_nav_playing}
                      text_font: nav20
                      text_color: ${color_text_muted}
                      hidden: true
            - obj:      # slot 2 - Stations (mdi-radio)
                id: nav_slot_stations
                x: 53
                y: 0
                width: 53
                height: 26
                bg_opa: TRANSP
                border_width: 0
                pad_all: 0
                clickable: false
                widgets:
                  - label:
                      id: nav_lbl_stations_big
                      align: CENTER
                      text: ${text_nav_stations}
                      text_font: menu24
                      text_color: ${color_accent}
                      hidden: true
                  - label:
                      id: nav_lbl_stations_small
                      align: CENTER
                      text: ${text_nav_stations}
                      text_font: nav20
                      text_color: ${color_text_muted}
            # Slot 3 - Settings (mdi-cogs): real page now (page_settings, the
            # third swipeable page). Focused when current_page == 2 - handled
            # by update_nav_indicator.
            - obj:
                id: nav_slot_settings
                x: 106
                y: 0
                width: 53
                height: 26
                bg_opa: TRANSP
                border_width: 0
                pad_all: 0
                clickable: false
                widgets:
                  - label:
                      id: nav_lbl_settings_big
                      align: CENTER
                      text: ${text_nav_settings}
                      text_font: menu24
                      text_color: ${color_accent}
                      hidden: true
                  - label:
                      id: nav_lbl_settings_small
                      align: CENTER
                      text: ${text_nav_settings}
                      text_font: nav20
                      text_color: ${color_text_muted}
  page_wrap: true