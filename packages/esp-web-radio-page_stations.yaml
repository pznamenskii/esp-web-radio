# ==============================================================================
# page_stations.yaml - Stations page (dynamic station button grid)
#
# Lists every available station as a button. The set of visible buttons follows
# whatever station-name data is available:
#   - HA connected:  station_1_name .. station_12_name sensors (HA template
#                    sensors, see ha_template_sensors.yaml)
#   - no-HA mode:    offline_station_1_name .. offline_station_4_name
#                    substitutions (see esp-web-radio-offline_stations.yaml)
# Population, slot visibility and grid height are handled centrally by the
# `refresh_stations` script (see esp-web-radio-lvgl_ui.yaml); every button
# routes playback through the `play_station` script (HA vs direct URL).
#
# Geometry: 12 slots in a 2-col x 6-row grid (224x52 buttons, 56 px pitch).
# The grid container height is set at runtime to rows*56, so the page shows a
# vertical scrollbar whenever more than 8 stations are active.
#
# Each button carries a station-logo slot (st_logo_N, 40x40 accent-tinted
# rounded rect) whose child is an lvgl.image fed by the STATIC image
# `station_img_N` compiled from the repo icons/ folder
# (packages/esp-web-radio-station_images.yaml). The "Radio Station N Image" HA
# sensor reports the icon file name and the `logo_mapping` resolves it to the
# compiled image at runtime (station_N_img sensors in
# esp-web-radio-homeassistant.yaml); an unknown name hides the image and the
# tinted slot itself is the placeholder. The name label is shifted right of
# the slot. See README "Station logos & artwork".
# ==============================================================================

lvgl:
  pages:
    - id: page_stations
      pad_all: 0
      scrollbar_mode: "AUTO"
      # Swipe navigation: shared handlers from swipe_navigation.yaml.
      <<: !include swipe_navigation.yaml
      widgets:
        - label:
            id: st_title
            styles: text_title
            x: 16
            y: 12
            width: 200
            height: 30
            text: "Станции"
            text_align: LEFT
        - obj:
            id: st_grid
            x: 0
            y: 48
            width: 480
            height: 112
            pad_all: 0
            scrollbar_mode: "OFF"
            widgets:
              - button:
                  id: st_btn_1
                  styles: station_button
                  hidden: true
                  x: 16
                  y: 0
                  width: 224
                  height: 52
                  pad_all: 0
                  on_click:
                    - logger.log: "[UI] CLICKED station 1"
                    - lambda: 'id(current_station) = 1;'
                    - script.execute: play_station
                  widgets:
                    - obj:
                        id: st_logo_1
                        x: 12
                        y: 6
                        width: 40
                        height: 40
                        radius: 8
                        bg_color: ${color_accent}
                        bg_opa: 15%
                        border_width: 1
                        border_color: ${color_accent}
                        border_opa: 40%
                        pad_all: 0
                        scrollbar_mode: "OFF"
                        clickable: false
                        widgets:
                          - image:
                              id: st_logo_pic_1
                              src: station_img_1
                              x: 0
                              y: 0
                    - label:
                        id: st_lbl_1
                        x: 60
                        y: 0
                        width: 152
                        height: 52
                        text: ""
                        text_align: LEFT
                        long_mode: SCROLL
                        text_font: ${font_body}
                        text_color: ${color_text_primary}
