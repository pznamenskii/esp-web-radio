# ==============================================================================
# station_images.yaml - station logos, statically compiled into the firmware
#
# Replaces the former online_image download pipeline. Rationale: two
# abort-crashes (2026-10-08/09: TLS certificate verification abort + a script
# restart storm) and, once those were fixed, 0.5-0.7 s main-loop stalls per
# HTTPS fetch - online_image/http_request download IN the ESPHome loop task,
# so every fetch froze the UI/visualizer. Downloads cannot be isolated from
# YAML. Decision: logos are now build-time static assets - zero network code,
# zero crash surface, zero stalls.
#
# How it works:
#   - The PNGs live in the repo `icons/` folder and are resized to 40x40 at
#     BUILD time (flash-resident RGB565 + alpha, ~4.8 KB each).
#   - The HA "Radio Station N Image" sensors (ha_template_sensors.yaml) report
#     an icon FILE NAME, e.g. "radio/logo-radio-dacha.png".
#   - The `logo_mapping` (string -> image) resolves that name to the compiled
#     image at runtime (see the station_N_img sensors in
#     esp-web-radio-homeassistant.yaml); an unknown/empty name hides the
#     lvgl.image and keeps the accent-tinted placeholder slot.
#
# To change a logo: replace the file in icons/ (keep the name), update the HA
# sensor if renamed - and reflash. Logos are static by design.
# ==============================================================================

mapping:
  - id: logo_mapping
    from: string
    to: image
    entries:
      "radio/logo-radio-dacha.png": station_img_1
      "radio/logo-radio-vanya.png": station_img_2
      "radio/logo-nashe-radio.png": station_img_3
      "radio/logo-rock-fm.png": station_img_4
      "radio/logo-avtoradio.png": station_img_5
      "radio/logo-dorozhnoe-radio.png": station_img_6
      "radio/logo-maximum.png": station_img_7
      "radio/logo-dfm.png": station_img_8
      "radio/logo-radio-nrj.png": station_img_9
      "radio/logo-russkoe-radio.png": station_img_10
      "radio/logo-radio-ultra.png": station_img_11
      "radio/logo-comedy-radio.png": station_img_12

image:
  - platform: file
    file: icons/logo-radio-dacha.png
    id: station_img_1
    type: rgb565
    transparency: alpha_channel
    resize: 40x40

  - platform: file
    file: icons/logo-radio-vanya.png
    id: station_img_2
    type: rgb565
    transparency: alpha_channel
    resize: 40x40

